<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversor de Músicas Web</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background-color: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 600px; position: relative;}
        
        .btn-voltar { position: absolute; top: 20px; left: 20px; text-decoration: none; color: #666; font-weight: bold; font-size: 14px; transition: 0.2s;}
        .btn-voltar:hover { color: #1DB954; }

        h1 { color: #333; margin-bottom: 20px; font-size: 24px; text-align: center; }
        input[type="text"], select { width: 100%; padding: 12px; margin: 10px 0 20px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { background-color: #1DB954; color: white; border: none; padding: 14px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; transition: 0.3s; }
        button:hover { background-color: #1aa34a; }
        button:disabled { background-color: #ccc; cursor: not-allowed; color: #666; }
        
        #area-progresso { margin-top: 30px; display: none; }
        .musica-item { background: #f9f9f9; border: 1px solid #eee; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .musica-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; font-weight: bold; color: #444; }
        .barra-fundo { background-color: #e0e0e0; border-radius: 10px; width: 100%; height: 10px; overflow: hidden; }
        .barra-preenchimento { background-color: #1DB954; height: 10px; width: 0%; transition: width 0.3s ease; }
        .status-texto { font-size: 12px; color: #666; margin-top: 5px; text-align: right; }
        .concluido .barra-preenchimento { background-color: #2b7fc3; } 
        .finalizado .barra-preenchimento { background-color: #4CAF50; } 
        .erro .barra-preenchimento { background-color: #f44336; width: 100% !important; }
    </style>
</head>
<body>

<div class="container">
    <a href="/" class="btn-voltar">← Voltar ao Hub</a>
    <h1>Baixar Músicas e Playlists</h1>
    
    <form id="form-download">
        <label for="link" style="display:block; font-weight:bold; color:#555;">Link (Spotify, Deezer ou YouTube):</label>
        <input type="text" id="link" name="link" placeholder="Cole o link aqui..." required>

        <label for="qualidade" style="display:block; font-weight:bold; color:#555;">Qualidade do Áudio:</label>
        <select id="qualidade" name="qualidade">
            <option value="320">Máxima (320 kbps)</option>
            <option value="192" selected>Padrão (192 kbps)</option>
            <option value="128">Básica (128 kbps)</option>
        </select>

        <button type="submit" id="btn-iniciar">Iniciar Download</button>
    </form>

    <div id="area-progresso">
        <h3 style="color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px;">Progresso</h3>
        <div id="lista-progresso"></div>
    </div>
</div>

<script>
    const form = document.getElementById('form-download');
    const areaProgresso = document.getElementById('area-progresso');
    const listaProgresso = document.getElementById('lista-progresso');
    const btnIniciar = document.getElementById('btn-iniciar');
    
    let intervaloBusca;
    let downloadsIniciados = new Set(); 

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        btnIniciar.disabled = true;
        btnIniciar.innerText = "Processando Link...";
        areaProgresso.style.display = 'block';
        listaProgresso.innerHTML = '';
        downloadsIniciados.clear(); 

        const formData = new URLSearchParams(new FormData(form));

        await fetch('/api/baixar', {
            method: 'POST',
            body: formData
        });

        btnIniciar.innerText = "Baixando...";
        intervaloBusca = setInterval(atualizarProgresso, 1000);
    });

    async function atualizarProgresso() {
        try {
            const res = await fetch('/api/progresso');
            const dados = await res.json();
            
            if (Object.keys(dados).length === 0) return;

            listaProgresso.innerHTML = ''; 
            let todosConcluidos = true;

            for (const [titulo, info] of Object.entries(dados)) {
                const porcentagemNumero = parseFloat(info.percent) || 0;
                
                let classeExtra = '';
                if (info.status.includes('Convertendo')) classeExtra = 'concluido';
                if (info.status.includes('Finalizado') || info.status.includes('Concluído')) classeExtra = 'finalizado';
                if (info.status.includes('Erro') || info.status.includes('Nenhuma') || info.status.includes('Bloqueado')) classeExtra = 'erro';
                
                if (!info.status.includes('Finalizado') && !info.status.includes('Concluído') && !info.status.includes('Erro') && !info.status.includes('Nenhuma')) {
                    todosConcluidos = false;
                }

                listaProgresso.innerHTML += `
                    <div class="musica-item ${classeExtra}">
                        <div class="musica-header">
                            <span>${titulo}</span>
                            <span>${classeExtra === 'erro' ? 'Falhou' : info.percent}</span>
                        </div>
                        <div class="barra-fundo">
                            <div class="barra-preenchimento" style="width: ${porcentagemNumero}%;"></div>
                        </div>
                        <div class="status-texto">${info.status}</div>
                    </div>
                `;

                if (info.arquivo_pronto && !downloadsIniciados.has(titulo)) {
                    downloadsIniciados.add(titulo); 
                    const a = document.createElement('a');
                    a.style.display = 'none';
                    a.href = `/download_final/${encodeURIComponent(info.arquivo_pronto)}`;
                    a.download = info.arquivo_pronto;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                }
            }

            if (todosConcluidos && Object.keys(dados).length > 0) {
                clearInterval(intervaloBusca);
                let contagem = 7; 
                btnIniciar.innerText = `Concluído! Resetando em ${contagem}s...`;
                const contadorIntervalo = setInterval(() => {
                    contagem--;
                    if (contagem > 0) {
                        btnIniciar.innerText = `Concluído! Resetando em ${contagem}s...`;
                    } else {
                        clearInterval(contadorIntervalo);
                        window.location.reload(); 
                    }
                }, 1000);
            }
        } catch (erro) {
            console.error("Erro ao buscar progresso:", erro);
        }
    }
</script>
</body>
</html>
